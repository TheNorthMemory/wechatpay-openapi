get:
  x-last-updated-at: 2025.06.26
  x-role:
    - 电商平台
  tags:
    - 收付通∙个人收款
  summary: 查询在途异常资金付款结果
  description: 资金交易异常未能及时完成时，可通过该接口快速查询在途异常资金付款流程状态，支持查看付款金额、入账账户、处理进度等信息。
  parameters:
    - name: receipt_id
      in: path
      required: true
      type: string
      description: 微信支付在途异常资金付款单号
      example: '0100011742874700562078230000'
  responses:
    200:
      schema:
        type: object
        required:
          - product_name
          - receipt_id
          - transfer_amount
          - receipt_state
        properties:
          product_name:
            type: string
            description: 产品名称
            example: 'C2C'
            enum:
              - C2C
          receipt_id:
            type: string
            description: 微信支付在途异常资金付款单号
            example: '0100011742874700562078230000'
          transfer_amount:
            type: object
            description: 付款金额信息
            required:
              - total
              - currency
            properties:
              total:
                type: integer
                description: 总金额
                example: 100
              currency:
                type: string
                description: 货币类型
                enum:
                  - CNY
          receipt_state:
            type: string
            description: 在途异常资金付款状态
            enum:
              - RECEIPT_STATE_PENDING
              - RECEIPT_STATE_PROGRESS
              - RECEIPT_STATE_COMPLETED
          create_time:
            type: string
            description: 在途异常资金付款单据创建时间
            example: '2018-06-08T10:34:56+08:00'
          last_update_time:
            type: string
            description: 在途异常资金付款单据更新时间
            example: '2018-06-08T10:34:56+08:00'
          instruction:
            type: object
            description: 在途异常资金付款指令信息
            required:
              - out_instruction_no
              - commander
              - transfer_mode
              - notify_url
              - instruction_state
            properties:
              out_instruction_no:
                type: string
                description: 商户侧指令编号
                example: '1200002'
              commander:
                type: object
                description: 在途异常资金付款指令的发起方
                required:
                  - operator
                  - mchid
                properties:
                  operator:
                    type: string
                    description: 发起在途异常资金付款请求的角色
                    enum:
                      - MERCHANT
                  mchid:
                    type: string
                    description: 微信支付商户号
                    example: '990055040'
              transfer_mode:
                type: string
                description: 付款方式
                enum:
                  - TRANSFER_TO_ORIGINAL_RECEIVE_USER
                  - TRANSFER_TO_ORIGINAL_RECEIVE_MERCHANT #付款至原收款商户
                  - TRANSFER_TO_SPECIFIED_RECEIVE_MERCHANT #付款到指定的收款商户
              success_time:
                type: string
                description: 入账成功时间
                example: '2018-06-08T10:34:56+08:00'
              notify_url:
                type: string
                description: 回调通知地址
                example: https://weixin.qq.com
              receiver:
                type: object
                description: 收款方
                properties:
                  account_type:
                    type: string
                    description: 入账账户类型
                    example: OTHERS
                  openid:
                    type: string
                    description: 入账用户OpenID
                    example: eoCuiA7RW33Tc3jtz_5CNLegC9kN0
                  appid:
                    type: string
                    description: 商户AppID
                    example: wxf636efh567hg4356
                  mchid:
                    type: string
                    description: 入账商户号
              instruction_state:
                type: string
                description: 在途异常资金付款指令状态
                enum:
                  - INSTRUCTION_STATE_PENDING #待执行
                  - INSTRUCTION_STATE_IN_PROGRESS #执行中
                  - INSTRUCTION_STATE_CLOSED #已关闭，此时可更换商户侧指令编号，并重新发起付款指令
                  - INSTRUCTION_STATE_SUCCESS #执行成功，可通过查询在途异常资金付款结果接口，进一步确认付款结果
              create_time:
                type: string
                format: rfc3339
                description: 在途异常资金付款指令创建时间
                example: '2023-10-01T12:34:56+08:00'
              instruction_instance_id:
                type: string
                description: 微信支付在途异常资金付款指令执行流水号
