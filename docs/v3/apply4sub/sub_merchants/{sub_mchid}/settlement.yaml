get:
  x-last-updated-at: 2023.08.16
  x-role: [普通服务商]
  tags:
    - 服务商∙进件
    - 收付通∙进件
  summary: 查询结算账户API
  description: 普通服务商（支付机构、银行不可用），可使用本接口查询其进件、已签约的特约商户-结算账户信息（敏感信息掩码）。 该接口可用于核实是否成功修改结算账户信息、及查询系统汇款验证结果。 [官方文档](https://pay.weixin.qq.com/wiki/doc/apiv3/wxpay/tool/applyment4sub/chapter3_4.shtml) [官方文档](https://pay.weixin.qq.com/docs/partner/apis/ecommerce-merchant-application/get-settlement.html)
  parameters:
    - name: sub_mchid
      in: path
      type: string
      description: 特约商户/二级商户号
      required: true
      example: '1900006491'
    - name: account_number_rule
      in: query
      type: string
      required: false
      description: 银行账号展示规则
      enum:
        - ACCOUNT_NUMBER_RULE_MASK_V1 #银行账号展示规则掩码v1，保留前2位和最后2位，中间用*代替
        - ACCOUNT_NUMBER_RULE_MASK_V2 #银行账号展示规则掩码v2，保留前6位和最后4位，中间用*代替
  responses:
    '200':
      schema:
        type: object
        required:
          - account_type
          - account_bank
          - account_number
          - verify_result
        properties:
          account_type:
            type: string
            description: 账户类型
            example: ACCOUNT_TYPE_BUSINESS
            enum:
              - ACCOUNT_TYPE_BUSINESS
              - ACCOUNT_TYPE_PRIVATE
          account_bank:
            type: string
            description: 开户银行
            example: 工商银行
          bank_name:
            type: string
            description: 开户银行全称（含支行）
            example: 施秉县农村信用合作联社城关信用社
          bank_branch_id:
            type: string
            description: 开户银行联行号
            example: '402713354941'
          account_number:
            type: string
            description: 银行账号
            example: 62*************78
          verify_result:
            type: string
            description: 验证结果
            example: VERIFY_SUCCESS
            enum:
              - VERIFY_SUCCESS
              - VERIFY_FAIL
              - VERIFYING
          verify_fail_reason:
            type: string
            description: 验证失败原因
            example: 用户姓名/证件/手机不匹配，请核对后重试
