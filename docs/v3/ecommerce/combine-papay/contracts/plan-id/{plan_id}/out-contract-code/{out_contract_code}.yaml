get:
  x-last-updated-at: 2021.10.27
  x-role:
    - 电商平台
    - 服务商
  tags:
    - 收付通∙合单代扣
  summary: 通过商户协议号查询协议API
  description: 电商服务商可以通过该接口发起签约协议的查询。 [官方文档](https://pay.weixin.qq.com/wiki/doc/apiv3_partner/Offline/apis/chapter5_5_2.shtml)
  parameters:
    - name: plan_id
      in: path
      required: true
      type: integer
      description: 委托代扣协议模板Id
      example: 12535
    - name: out_contract_code
      in: path
      required: true
      type: string
      description: 商户签约协议号
      example: wxwtdk20200910100000
  responses:
    '200':
      schema:
        type: object
        required:
          - mchid
          - contract_id
          - appid
          - plan_id
          - out_contract_code
          - contract_display_account
          - contract_state
          - contract_signed_time
          - contract_expired_time
          - openid
        properties:
          mchid:
            type: string
            description: 商户号
            example: '1900000109'
          contract_id:
            type: string
            description: 委托代扣协议Id
            example: '123124412412423431'
          appid:
            type: string
            description: 商户APPID
            example: wxd678efh567hg6787
          plan_id:
            type: integer
            description: 委托代扣协议模板Id
            example: 12535
          out_contract_code:
            type: string
            description: 商户签约协议号
            example: wxwtdk20200910100000
          contract_display_account:
            type: string
            description: 用户账户展示名称
            example: 微信代扣用户A
          contract_state:
            type: string
            description: 委托代扣协议状态
            example: SIGNED
            enum:
              - NOT_SIGNED #未签约。
              - SIGNED #已签约。
              - TERMINATED #已解约。
          contract_signed_time:
            type: string
            description: 协议签署时间
            example: '2020-09-10T13:29:35.120+08:00'
          contract_expired_time:
            type: string
            description: 协议到期时间
            example: '2021-09-10T13:29:35.120+08:00'
          contract_terminate_info:
            type: object
            description: 协议解约信息
            required:
              - contract_termination_mode
              - contract_terminated_time
              - contract_termination_remark
            properties:
              contract_termination_mode:
                type: string
                description: 协议解约方式
                example: MCH_API_TERMINATE
                enum:
                  - USER_TERMINATE #用户主动解约
                  - MCH_API_TERMINATE #商户通过API发起的解约
                  - WEPAY_WEB_TERMINATE #商户在商户平台发起的解约
                  - CUSTOM_SERVICE_TERMINATE #用户联系微信支付客服发起的解约
                  - SYSTEM_TERMINATE #微信支付系统主动发起的解约
              contract_terminated_time:
                type: string
                description: 协议解约时间
                example: '2020-10-10T13:29:35.120+08:00'
              contract_termination_remark:
                type: string
                description: 解约备注
                example: 用户解约
          openid:
            type: string
            description: 用户openid
            example: o-MYE42l80oelYMDE34nYD456Xoy
          attach:
            type: string
            description: 附加数据
            example: example_attach
