get:
  x-last-updated-at: 2026.08.19
  x-role:
    - 电商平台
  tags:
    - 收付通∙进件
  summary: 查询指定主体子商户列表
  description: 接口适用场景：收付通（平台）服务商可通过本接口，查询其名下指定主体的子商户列表。1、通过organization_type与cert_number定位主体。2、仅返回属于指定主体、与当前服务商存在有效父子绑定关系且未注销的子商户。3、支持limit/offset分页查询。
  parameters:
    - $ref: '../../definitions/Parameters.yaml#/HTTP_WECHATPAY_SERIAL'
    - name: organization_type
      in: query
      type: string
      required: true
      description: 主体类型
      example: SUBJECT_TYPE_ENTERPRISE
      enum:
        - SUBJECT_TYPE_ENTERPRISE
        - SUBJECT_TYPE_INSTITUTIONS_CLONED
        - SUBJECT_TYPE_INDIVIDUAL
        - SUBJECT_TYPE_OTHERS
        - SUBJECT_TYPE_GOVERNMENT
        - SUBJECT_TYPE_MICRO
    - name: cert_number
      in: query
      type: string
      format: base64
      required: true
      description: 证件号码
      example: Iuas%2BxWj7ma0t%
    - name: limit
      in: query
      type: integer
      description: 分页大小
      example: 20
    - name: offset
      in: query
      type: integer
      description: 分页偏移
      example: 0
  responses:
    '200':
      schema:
        type: object
        required:
          - data
          - offset
          - limit
          - total_count
        properties:
          data:
            type: array
            description: 子商户列表
            items:
              type: object
              required:
                - sub_mchid
                - merchant_shortname
                - sign_time
              properties:
                sub_mchid:
                  type: string
                  description: 子商户号
                  example: '1900000109'
                merchant_shortname:
                  type: string
                  description: 商户简称
                  example: 腾讯科技有限公司
                sign_time:
                  type: string
                  format: rfc3339
                  description: 签约时间
                  example: '2018-06-08T10:34:56+08:00'
          offset:
            type: integer
            description: 分页偏移
            example: 0
          limit:
            type: integer
            description: 分页大小
            example: 20
          total_count:
            type: integer
            description: 总条数
            example: 100
