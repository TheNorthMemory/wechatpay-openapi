post:
  x-last-updated-at: 2025.04.14
  x-role:
    - 普通商户
  tags:
    - 资金应用∙转账∙QQ钱包
  summary: 撤销转账到QQ钱包
  description: 商户通过转账接口发起付款后，在转账成功之前可以通过该接口撤销付款。该接口返回成功仅表示撤销请求已受理，系统会异步处理退款等操作，最终以查询单据返回的状态为准。
  parameters:
    - name: out_bill_no
      in: path
      required: true
      type: string
      description: 商户单号
      example: plfk2020042013
  responses:
    '200':
      schema:
        type: object
        required:
          - out_bill_no
          - transfer_bill_no
          - state
          - update_time
        properties:
          mchid:
            type: string
            description: 商户号
            example: '1900001109'
          out_bill_no:
            type: string
            description: 商户单号
            example: plfk2020042013
          transfer_bill_no:
            type: string
            description: 微信转账单号
            example: '1330000071100999991182020050700019480001'
          state:
            type: string
            description: 单据状态
            example: ACCEPTED
            enum:
              - CANCELING #商户撤销请求受理成功，该笔转账正在撤销中
              - CANCELLED #转账撤销完成
          update_time:
            type: string
            format: rfc3339
            description: 最后一次状态变更时间
            example: '2015-05-20T13:29:35.120+08:00'
