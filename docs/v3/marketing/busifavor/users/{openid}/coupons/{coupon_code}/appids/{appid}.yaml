get:
  x-last-updated-at: 2025.07.25
  x-role:
    - 直连商户
  tags:
    -  运营工具∙商家券
  summary: 查询用户单张券详情API
  description: 服务商可通过该接口查询微信用户卡包中某一张商家券的详情信息。 [官方文档](https://pay.weixin.qq.com/wiki/doc/apiv3/wxpay/marketing/busifavor/chapter3_5.shtml)
  parameters:
    - name: coupon_code
      in: path
      type: string
      required: true
      description: 券code
    - name: appid
      in: path
      type: string
      required: true
      description: 公众账号ID
    - name: openid
      in: path
      type: string
      required: true
      description: 用户标识
  responses:
    200:
      schema:
        allOf:
          - $ref: '../../../../../../../../definitions/BusiFavorCouponStock.yaml#/CouponBase'
          - type: object
            properties:
              coupon_code:
                type: string
                description: 券code
                example: '123446565767'
              coupon_state:
                allOf:
                  - $ref: '../../../../../../../../definitions/Enumerations.yaml#/CouponState'
                  - enum:
                    - PENDING_REDEEM
                    - REDEEM_CONFIRMING
                    - REDEEM_FAILED
                    - REDEEM_EXPIRED
                example: SENDED
              stock_id:
                type: string
                description: 批次号
                example: '1002323'
              transferable:
                type: boolean
                description: 是否允许转赠
              shareable:
                type: boolean
                description: 是否允许分享链接
          - type: object
            required: [send_request_no, available_start_time, expire_time, receive_time]
            properties:
              send_request_no:
                type: string
                description: 发券请求单号
                example: MCHSEND202003101234
              use_request_no:
                type: string
                description: 核销请求单号
                example: MCHUSE202003101234
              available_start_time:
                type: string
                format: rfc3339
                description: 券可使用开始时间
                example: '2019-12-30T13:29:35+08:00'
              expire_time:
                type: string
                format: rfc3339
                description: 券过期时间
                example: '2019-12-31T13:29:35+08:00'
              receive_time:
                type: string
                format: rfc3339
                description: 券领券时间
                example: '2019-12-30T13:29:35+08:00'
              use_time:
                type: string
                format: rfc3339
                description: 券核销时间
                example: '2019-12-31T13:29:35+08:00'
              associate_out_trade_no:
                type: string
                description: 关联的商户订单号
                example: '2000-01-01T00:00:00+08:00'
              return_request_no:
                type: string
                description: 回退请求单号
                example: MCHRETURN202003101234
              return_time:
                type: string
                description: 券回退时间
                example: '2020-07-31T13:29:35+08:00'
              deactivate_request_no:
                type: string
                description: 失效请求单号
                example: MCHRETURN202003101234
              deactivate_time:
                type: string
                description: 券失效时间
                example: '2020-07-31T13:29:35+08:00'
              deactivate_reason:
                type: string
                description: 失效原因
                example: 此券使用时间错误
              associate_mch_id:
                type: string
                description: 关联的下单商户号
                example: '190000001'
              associate_transaction_id:
                type: string
                description: 关联的微信支付订单号
                example: '4200000001856498491'
              associate_sub_mch_id:
                type: string
                description: 关联的下单子商户号
                example: '190000002'
