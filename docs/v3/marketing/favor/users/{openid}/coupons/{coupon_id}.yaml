get:
  x-last-updated-at: 2024.05.28
  x-role: [直连商户, 服务商, 渠道商]
  tags:
    - 运营工具∙代金券
  summary: 查询代金券详情API
  description: 通过此接口可查询代金券信息，包括代金券的基础信息、状态。如代金券已核销，会包括代金券核销的订单信息（订单号、单品信息等）。 [官方文档](https://pay.weixin.qq.com/docs/merchant/apis/cash-coupons/coupon/query-coupon.html) [官方文档](https://pay.weixin.qq.com/docs/partner/apis/cash-coupons/coupon/query-coupon.html) [官方文档](https://pay.weixin.qq.com/wiki/doc/apiv3/wxpay/marketing/convention/chapter3_6.shtml)
  parameters:
    - name: openid
      in: path
      required: true
      type: string
      description: 用户openid
      example: Openid_example
    - name: coupon_id
      in: path
      required: true
      type: string
      description: 代金券id
      example: '9856888'
    - name: appid
      in: query
      required: true
      type: string
      description: 公众账号ID
      example: appid_example
  responses:
    200:
      schema:
        allOf:
          - $ref: '../../../../../../definitions/FavorCouponStock.yaml#CouponOwner'
          - type: object
            required:
              - no_cash
            properties:
              available_balance:
                type: number
                description: 剩余金额
                example: 10000
              business_type:
                type: string
                description: 业务类型
                example: MULTIUSE
                enum:
                  - MULTIUSE
              no_cash:
                type: boolean
                description: 是否无资金流
              out_request_no:
                type: string
                description: 商户单据号
                example: example_out_request_no
              discount_msg:
                type: object
                description: 折扣券信息
                required:
                  - discount_amount_max
                  - discount_percent
                properties:
                  discount_amount_max:
                    type: integer
                    description: 最高折扣金额
                    example: 100
                  discount_percent:
                    type: integer
                    description: 折扣百分比
                    example: 88
                  transaction_minimum:
                    type: integer
                    description: 门槛
                    example: 100
