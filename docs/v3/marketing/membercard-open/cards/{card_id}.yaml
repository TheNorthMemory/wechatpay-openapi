get:
  x-last-updated-at: 2024.09.20
  x-role:
    - 直连商户
    - 服务商
  tags:
    - 会员卡∙基础功能
  summary: 查询会员卡模板信息API
  description: 通过此接口可查询指定会员卡模板的所有信息
  parameters:
    - name: card_id
      in: path
      required: true
      type: string
      description: 会员卡id
      example: pbLatjvWOibDc5-TBnbUk1pD12o0
  responses:
    200:
      schema:
        allOf:
          - $ref: ../../../../definitions/MemberCard.yaml#Record
          - type: object
            properties:
              bonus:
                type: object
                description: 会员积分
                required:
                  - init_bonus
                  - bonus_value_word
                  - bonus_cost_word
                properties:
                  init_bonus:
                    type: integer
                    description: 会员初始积分值
                    example: 0
                  bonus_value_word:
                    type: string
                    description: 积分值文案
                    example: 我的积分
                  bonus_cost_title:
                    type: string
                    description: 积分价值项标题
                    example: 积分兑换
                  bonus_cost_word:
                    type: string
                    description: 积分价值项文案
                    example: 500积分=2小时免费停车券
                  bonus_jump_word:
                    type: string
                    description: 积分跳转文案
                    example: 更多礼品
                  bonus_jump_appid:
                    type: string
                    description: 积分跳转AppID
                    example: wxea9c30a90fs8d3fe
                  bonus_jump_path:
                    type: string
                    description: 积分跳转path
                    example: /pages/bonus/bonus
                  bonus_support_appid:
                    type: string
                    description: 自助积分跳转AppID
                    example: wxea9c30a90fs8d3fe
                  bonus_support_path:
                    type: string
                    description: 自助积分跳转path
                    example: pages/selfbonus/selfbonus
              favor:
                type: object
                description: 会员优惠
                required:
                  - show_coupon
                properties:
                  show_coupon:
                    type: boolean
                    description: 是否展示优惠券
                  member_price_word:
                    type: string
                    description: 会员专享价文案
                    example: 周二会员全场八折
                  member_price_appid:
                    type: string
                    description: 会员专享价跳转AppID
                    example: wxea9c30a90fs8d3fe
                  member_price_path:
                    type: string
                    description: 会员专享价跳转path
                    example: pages/favor/favor
              service_modules:
                type: array
                description: 会员服务项
                items:
                  type: object
                  required:
                    - service_module_id
                  properties:
                    service_module_id:
                      type: string
                      description: 会员服务项id
                      example: '666'
                    jump_miniprogram:
                      type: object
                      description: 跳转小程序
                      required:
                        - appid
                        - path
                      properties:
                        appid:
                          type: string
                          description: 小程序AppID
                          example: wx37178d097a6851d8
                        path:
                          type: string
                          description: 小程序path
                          example: pages/index/index
              fapiao:
                type: object
                description: 会员发票
                properties:
                  fapiao_jump_word:
                    type: string
                    description: 发票跳转文案
                    example: 查看我的发票
                  fapiao_jump_appid:
                    type: string
                    description: 发票跳转AppID
                    example: wxea9c30a90fs8d3fe
                  fapiao_jump_path:
                    type: string
                    description: 发票跳转path
                    example: pages/fapiao/fapiao
              guide:
                type: object
                description: 客服信息
                required:
                  - staff_name
                  - head_image_url
                properties:
                  staff_name:
                    type: string
                    description: 联系人名字
                    example: 酒店管家-何小明
                  head_image_url:
                    type: string
                    description: 联系人头像
                    example: https://wxpaylogo.qpic.cn/wxpaylogo/xxxxx/0
                  contact_information_name:
                    type: string
                    description: 联系方式
                    example: 微信号
                  contact_information_value:
                    type: string
                    description: 联系信息值
                    example: weixin123
                  phone_number:
                    type: string
                    description: 联系电话
                    example: 0755-12345677
              need_dynamic_code:
                type: boolean
                description: 是否启用动态码
patch:
  x-last-updated-at: 2024.09.20
  x-role:
    - 直连商户
    - 服务商
  tags:
    - 会员卡∙基础功能
  summary: 修改会员卡模板信息API
  description: 通过此接口可更新会员卡的信息，包括基本信息、储值信息、开卡信息、补充说明
  parameters:
    - name: card_id
      in: path
      required: true
      type: string
      description: 会员卡id
      example: pbLatjvWOibDc5-TBnbUk1pD12o0
    - name: _
      in: body
      required: true
      schema:
        type: object
        properties:
          appid:
            type: string
            description: 商户AppId
            example: wxea9c30890f48d5ae
          logo_url:
            type: string
            format: MediaUrl
            description: 会员卡logo
            example: 'https://wxpaylogo.qpic.cn/wxpaylogo/xxxxx/0'
          title:
            type: string
            description: 卡名称
            example: 微信支付测试卡
          background_picture_url:
            type: string
            format: MediaUrl
            description: 会员卡背景图
            example: 'https://wxpaylogo.qpic.cn/wxpaylogo/xxxxx/0'
          description:
            type: string
            description: 使用须知
            example: 使用本会员卡表示你同意xxx公司的协议，最终解释权归xxx公司所有
          service_phone:
            type: string
            description: 服务电话
            example: 010-8877xxxx
          total_quantity:
            type: integer
            description: 会员卡总库存
            example: 5000000
          date_information:
            type: object
            description: 有效期
            required:
              - type
            properties:
              type:
                $ref: '../../../../definitions/Enumerations.yaml#MemberCardDateInformationType'
              available_end_time:
                type: string
                description: 有效期结束时间
                example: '2030-05-20T13:29:35.120+08:00'
              available_day_after_receive:
                type: integer
                description: 生效后N天内有效
                example: 200
              wait_days_after_receive:
                type: integer
                description: 领取后N天开始生效
                example: 2
              available_begin_time:
                type: string
                description: 有效期开始时间
                example: '2020-05-20T13:29:35.120+08:00'
          init_level:
            type: string
            description: 会员初始等级
            example: 白银会员
          balance_information:
            type: object
            description: 储值信息
            properties:
              need_balance:
                type: boolean
                description: 是否支持储值
              balance_appid:
                type: string
                description: 储值小程序appid
                example: wxea9c30890f48d5ae
              balance_path:
                type: string
                description: 储值小程序path
                example: pages/balance/balance
              balance_url:
                type: string
                description: 储值url
                example: 'https://xxx.com'
          user_information_form:
            type: object
            description: 开卡信息
            properties:
              can_modify_after_activate:
                type: boolean
                description: 是否允许修改
              common_field_list:
                type: array
                description: 平台提供的通用开卡信息字段
                items:
                  $ref: '../../../../definitions/Enumerations.yaml#MemberCardUserInformationCommonField'
                example:
                  - USER_FORM_FLAG_MOBILE
              custom_field_list:
                type: array
                description: 商户自定义的开卡信息字段
                items:
                  type: object
                  properties:
                    type:
                      $ref: '../../../../definitions/Enumerations.yaml#MemberCardUserInformationCustomFieldType'
                    name:
                      type: string
                      description: 字段名称
                      example: 喜欢的运动
                    values:
                      type: array
                      items:
                        type: string
                      description: 字段值
                      example:
                        - 篮球
                        - 足球
                        - 羽毛球
          additional_statement:
            type: object
            description: 商户补充声明
            properties:
              title:
                type: string
                description: 标题
                example: xxx会员卡使用须知
              url:
                type: string
                description: 跳转url
                example: 'https://xxx.111.com'
              appid:
                type: string
                description: 跳转小程序appid
                example: wxea9c30890f48d5ae
              path:
                type: string
                description: 跳转小程序path
                example: pages/statement/statement
          code_mode:
            type: string
            description: 会员卡code分配类型
            example: SYSTEM_ALLOCATE
            enum:
              - SYSTEM_ALLOCATE
              - MERCHANT_DEPOSIT
              - REAL_TIME
          code_type:
            type: string
            description: 会员码型
            example: BAR_CODE
            enum:
              - BAR_CODE
              - QRCODE
              - BAR_CODE_AND_QRCODE
              - NONE_CODE
          need_dynamic_code:
            type: boolean
            description: 是否启用动态码
            example: false
  responses:
    204: {}
delete:
  x-last-updated-at: 2024.09.20
  x-role:
    - 直连商户
    - 服务商
  tags:
    - 会员卡∙基础功能
  summary: 删除会员卡模板API
  description: 商户可调用此api删除会员卡。删除后，商家将无法通过任何渠道再投放该会员卡。
  parameters:
    - name: card_id
      in: path
      required: true
      type: string
      description: 会员卡id
      example: pbLatjvWOibDc5-TBnbUk1pD12o0
  responses:
    204: {}
