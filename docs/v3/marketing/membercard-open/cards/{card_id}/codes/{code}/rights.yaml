patch:
  x-last-updated-at: 2024.11.18
  x-role:
    - 直连商户
    - 服务商
  tags:
    - 会员卡∙权益设置
  summary: 设置会员权益API
  description: 通过此接口商家可设置是否在用户的会员卡详情页展示积分、优惠、发票等权益及服务模块
  parameters:
    - name: card_id
      in: path
      required: true
      type: string
      description: 会员卡id
      example: pbLatjvWOibDc5-TBnbUk1pD12o0
    - name: code
      in: path
      required: true
      type: string
      description: 会员卡code
      example: '478515832665'
    - name: _
      in: body
      required: true
      schema:
        type: object
        required:
          - out_request_no
        properties:
          before_bonus_value:
            type: integer
            description: 变更前的会员积分值
            example: 500
          bonus_value:
            type: integer
            description: 变更后的会员积分值
            example: 600
          add_bonus_value:
            type: integer
            description: 会员积分变动值
            example: 100
          out_request_no:
            type: string
            description: 商户请求单号
            example: 100002322019090134234sfdf
          need_inform_bonus:
            type: boolean
            description: 是否发送积分变更通知
            example: true
          member_price_word:
            type: string
            description: 会员专享价文案
            example: 钻石会员尊享8折
          fapiao_jump_word:
            type: string
            description: 会员发票跳转文案
            example: 3张发票可开
          guide:
            type: object
            description: 会员专属咨询信息
            properties:
              staff_name:
                type: string
                description: 联系人名字
                example: 酒店管家-何小明
              head_image_url:
                type: string
                description: 联系人头像
                example: https://wxpaylogo.qpic.cn/wxpaylogo/xxxxx/0
              contact_information_name:
                type: string
                description: 联系方式
                example: 微信号
              contact_information_value:
                type: string
                description: 联系信息值
                example: weixin123
              phone_number:
                type: string
                description: 联系电话
                example: 0755-12345677
  responses:
    204: {}
