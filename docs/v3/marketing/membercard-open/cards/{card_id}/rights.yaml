patch:
  x-last-updated-at: 2024.11.18
  x-role:
    - 直连商户
    - 服务商
  tags:
    - 会员卡∙权益设置
  summary: 设置会员卡模板权益项API
  description: 通过此接口商家可设置是否在用户的会员卡详情页展示积分、优惠、发票等权益及服务模块
  parameters:
    - name: card_id
      in: path
      required: true
      type: string
      description: 会员卡id
      example: pbLatjvWOibDc5-TBnbUk1pD12o0
    - name: _
      in: body
      required: true
      schema:
        type: object
        required:
          - show_bonus
          - show_favor
        properties:
          show_bonus:
            type: boolean
            description: 是否展示会员积分
          show_favor:
            type: boolean
            description: 是否展示会员优惠
          bonus:
            type: object
            description: 会员积分
            required:
              - init_bonus
              - bonus_value_word
              - bonus_cost_word
            properties:
              init_bonus:
                type: integer
                description: 会员初始积分值
                example: 100
              bonus_value_word:
                type: string
                description: 积分值文案
                example: 我的积分
              bonus_cost_title:
                type: string
                description: 积分价值项标题
                example: 积分兑换
              bonus_cost_word:
                type: string
                description: 积分价值项文案
                example: 500积分=2小时免费停车券
              bonus_jump_word:
                type: string
                description: 积分跳转文案
                example: 更多礼品
              bonus_jump_appid:
                type: string
                description: 积分跳转appid
                example: wxea9c30a90fs8d3fe
              bonus_jump_path:
                type: string
                description: 积分跳转path
                example: /pages/bonus/bonus
              bonus_support_appid:
                type: string
                description: 自助积分跳转appid
                example: wxea9c30a90fs8d3fe
              bonus_support_path:
                type: string
                description: 自助积分跳转path
                example: pages/selfbonus/selfbonus
          favor:
            type: object
            description: 会员优惠
            required:
              - show_coupon
            properties:
              show_coupon:
                type: boolean
                description: 是否展示优惠券
              member_price_word:
                type: string
                description: 会员专享价文案
                example: 周二会员全场八折
              member_price_appid:
                type: string
                description: 会员专享价跳转appid
                example: wxea9c30a90fs8d3fe
              member_price_path:
                type: string
                description: 会员专享价跳转path
                example: pages/favor/favor
              member_price_title:
                type: string
                description: 会员专享价标题
                example: MEMBER_PRICE
                enum:
                  - MEMBER_PRICE
                  - MEMBER_ACTIVITY
              favor_module_title:
                type: string
                description: 会员优惠栏目名称
                example: FAVOR
                enum:
                  - FAVOR
                  - VIP
          show_fapiao:
            type: boolean
            description: 是否展示会员发票
            example: false
          fapiao:
            type: object
            description: 会员发票
            properties:
              fapiao_jump_word:
                type: string
                description: 发票跳转文案
                example: 查看我的发票
              fapiao_jump_appid:
                type: string
                description: 发票跳转AppID
                example: wxea9c30a90fs8d3fe
              fapiao_jump_path:
                type: string
                description: 发票跳转path
                example: pages/fapiao/fapiao
          show_guide:
            type: boolean
            description: 是否展示会员专属咨询
            example: false
          guide:
            type: object
            description: 会员专属咨询信息
            properties:
              staff_name:
                type: string
                description: 联系人名字
                example: 酒店管家-何小明
              head_image_url:
                type: string
                description: 联系人头像
                example: https://wxpaylogo.qpic.cn/wxpaylogo/xxxxx/0
              contact_information_name:
                type: string
                description: 联系方式
                example: 微信号
              contact_information_value:
                type: string
                description: 联系信息值
                example: weixin123
              phone_number:
                type: string
                description: 联系电话
                example: 0755-12345677
  responses:
    204: {}
