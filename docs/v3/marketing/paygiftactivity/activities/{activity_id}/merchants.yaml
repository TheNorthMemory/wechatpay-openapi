get:
  x-last-updated-at: 2019.11.28
  x-role: [微信支付商户, 服务商, 渠道商]
  tags:
    - 运营工具∙支付有礼
  summary: 查询活动发券商户号API
  description: 商户创建活动后，可以通过该接口查询支付有礼的发券商户号，用于管理活动。 [官方文档](https://pay.weixin.qq.com/wiki/doc/apiv3/wxpay/marketing/paygiftactivity/chapter3_5.shtml)
  parameters:
    - name: activity_id
      in: path
      type: string
      description: 活动id
      example: '126002309'
      required: true
    - name: offset
      in: query
      type: integer
      description: 分页页码
      example: 0
    - name: limit
      in: query
      type: integer
      description: 分页大小
      example: 20
  responses:
    200:
      schema:
        type: object
        properties:
          offset:
            type: integer
            description: 分页页码
            example: 0
          limit:
            type: integer
            description: 分页大小
            example: 20
          total_count:
            type: integer
            description: 总数
            example: 30
          activity_id:
            type: string
            description: 活动id
            example: '126002309'
          data:
            type: array
            description: 结果集
            items:
              type: object
              properties:
                mchid:
                  type: string
                  description: 商户号
                  example: '6002309'
                merchant_name:
                  type: string
                  description: 商户名称
                  example: 良品铺子
                create_time:
                  type: string
                  format: rfc3339
                  description: 创建时间
                  example: '2015-05-20T13:29:35.120+08:00'
                update_time:
                  type: string
                  format: rfc3339
                  description: 更新时间
                  example: '2015-05-20T13:29:35.120+08:00'
