post:
  x-last-updated-at: 2024.11.18
  x-role:
    - 微信支付商户
    - 服务商
    - 渠道商
  tags:
    - 运营工具∙支付有礼
  summary: 创建全场满额送活动API
  description: 商户可以创建满额送活动，用户支付后送全场券，提升交易额。
  parameters:
    - name: _
      in: body
      required: true
      schema:
        allOf:
          - $ref: '../../../definitions/PayGiftActivity.yaml#ActivityBase'
          - type: object
            properties:
              award_send_rule:
                allOf:
                  - $ref: '../../../definitions/PayGiftActivity.yaml#FullSendRuleBase'
                  - type: object
                    description: 活动奖品发放规则
                    properties:
                      merchant_id_list:
                        type: array
                        description: 发券商户号列表
                        items:
                          type: string
              advanced_setting:
                type: object
                properties:
                  payment_method_information:
                    type: object
                    description: 支付方式信息
                    properties:
                      payment_method:
                        type: string
                        description: 支付方式
                        enum:
                          - CFT
                          - SPECIFIC_BANK_CARD
                      bank_abbreviation:
                        type: string
                        description: 银行简称
  responses:
    200:
      schema:
        type: object
        required:
          - activity_id
          - create_time
        properties:
          activity_id:
            type: string
            description: 活动id
          create_time:
            type: string
            format: rfc3339
            description: 创建时间
