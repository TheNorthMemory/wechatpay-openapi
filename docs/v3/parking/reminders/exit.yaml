post:
  x-last-updated-at: 2026.06.29
  x-role:
    - 普通服务商
  tags:
    - 停车缴费服务
  summary: 同步车辆离场通知
  description: 对商户提供同步车辆离场通知接口
  parameters:
    - name: _
      in: body
      required: true
      schema:
        type: object
        required:
          - out_serial_number
          - exit_timestamp
          - plate_number
          - plate_color
          - parking_id
        properties:
          out_serial_number:
            type: string
            maxLength: 64
            description: 商户停车单号
            example: "PARK202407041530001"
          exit_timestamp:
            type: integer
            description: 车辆出场时间
            example: 1720081800
          plate_number:
            type: string
            maxLength: 16
            description: 车牌号
            example: "粤B12345"
          plate_color:
            type: string
            description: 车牌颜色
            enum:
              - PLATE_COLOR_UNKNOWN
              - PLATE_COLOR_BLUE
              - PLATE_COLOR_YELLOW
              - PLATE_COLOR_BLACK
              - PLATE_COLOR_WHITE
              - PLATE_COLOR_GREEN
              - PLATE_COLOR_YELLOW_GREEN
              - PLATE_COLOR_AGRICULTURAL_YELLOW
              - PLATE_COLOR_OTHER
            example: "PLATE_COLOR_BLUE"
          parking_id:
            type: string
            maxLength: 64
            description: 微信停车场ID
            example: "WXPARK001"
          pay_state:
            type: string
            description: 支付状态
            enum:
              - PAY_STATUS_UNKNOWN
              - PAY_STATUS_UNPAID
              - PAY_STATUS_PAID
            example: "PAY_STATUS_PAID"
          pay_type:
            type: string
            description: 支付类型
            enum:
              - PAY_TYPE_UNKNOWN
              - PAY_TYPE_WXPAY
              - PAY_TYPE_OTHERS
            example: "PAY_TYPE_WXPAY"
          out_trade_no:
            type: string
            maxLength: 64
            description: 商户支付订单号
            example: "TRADE202407041530001"
          total_amount:
            type: integer
            description: 总费用
            example: 1500
          paid_amount:
            type: integer
            description: 已支付费用
            example: 1500
          openid:
            type: string
            maxLength: 128
            description: 付款用户OpenID
            example: "oUpF8uMuAJO_M2pxb1Q9zNjWeS6o"
          pay_channel:
            type: string
            description: 支付渠道
            enum:
              - PAY_CHANNEL_UNKNOWN
              - PAY_CHANNEL_WECHAT_PAY_NOTIF
              - PAY_CHANNEL_SCAN_QRCODE
              - PAY_CHANNEL_OFFICIAL_ACCOUNT
              - PAY_CHANNEL_MCH_MINI_PROG
              - PAY_CHANNEL_OTHERS
            example: "PAY_CHANNEL_WECHAT_PAY_NOTIF"
          pay_time:
            type: integer
            description: 支付时间
            example: 1720081800
          token:
            type: string
            maxLength: 256
            description: 消息支付防伪凭证
            example: "token1234567890"
          wx_trade_no:
            type: string
            maxLength: 64
            description: 微信支付订单号
            example: "4200001999202407041234567890"
  responses:
    204: {}
