post:
  x-last-updated-at: 2026.06.29
  x-role:
    - 普通服务商
  tags:
    - 停车缴费服务
  summary: 同步支付结果通知
  description: 对商户提供同步支付结果通知接口
  parameters:
    - name: _
      in: body
      required: true
      schema:
        type: object
        required:
          - out_serial_number
          - plate_number
          - parking_id
          - parking_state
          - pay_type
          - total_amount
          - paid_amount
        properties:
          out_serial_number:
            type: string
            maxLength: 64
            description: 商户停车单号
            example: "PARK202407041530001"
          plate_number:
            type: string
            maxLength: 16
            description: 车牌号
            example: "粤B12345"
          parking_id:
            type: string
            maxLength: 64
            description: 微信停车场ID
            example: "WXPARK001"
          parking_state:
            type: string
            description: 停车状态
            enum:
              - PARKING_STATUS_UNKNOWN
              - PARKING_STATUS_PARKING
              - PARKING_STATUS_NOT_PARKING
            example: "PARKING_STATUS_PARKING"
          pay_type:
            type: string
            description: 支付类型
            enum:
              - PAY_TYPE_UNKNOWN
              - PAY_TYPE_WXPAY
              - PAY_TYPE_OTHERS
            example: "PAY_TYPE_WXPAY"
          openid:
            type: string
            maxLength: 128
            description: 付款用户OpenID
            example: "oUpF8uMuAJO_M2pxb1Q9zNjWeS6o"
          sub_mchid:
            type: string
            maxLength: 32
            description: 特约商户号
            example: "1900000109"
          total_amount:
            type: integer
            description: 总费用
            example: 1500
          paid_amount:
            type: integer
            description: 已支付费用
            example: 1500
          out_trade_no:
            type: string
            maxLength: 64
            description: 商户支付订单号
            example: "TRADE202407041530001"
          pay_channel:
            type: string
            description: 支付渠道
            enum:
              - PAY_CHANNEL_UNKNOWN
              - PAY_CHANNEL_WECHAT_PAY_NOTIF
              - PAY_CHANNEL_SCAN_QRCODE
              - PAY_CHANNEL_OFFICIAL_ACCOUNT
              - PAY_CHANNEL_MCH_MINI_PROG
              - PAY_CHANNEL_OTHERS
            example: "PAY_CHANNEL_WECHAT_PAY_NOTIF"
          pay_time:
            type: integer
            description: 支付时间
            example: 1720081800
          token:
            type: string
            maxLength: 256
            description: 消息支付防伪凭证
            example: "token1234567890"
          wx_trade_no:
            type: string
            maxLength: 64
            description: 微信支付订单号
            example: "4200001999202407041234567890"
  responses:
    204: {}
